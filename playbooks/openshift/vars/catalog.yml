---
# Configuração da integração com GitHub e Red Hat Developer Hub (RHDH),
# usada por create_project.yml e deploy_httpd.yml.
#
# No AAP, os segredos e endereços vêm da credencial customizada
# "GitHub + Developer Hub Catalog" (aap/credential_types/), que injeta as
# variáveis de ambiente lidas abaixo. Qualquer valor pode ser sobrescrito
# por extra vars / survey.

# Liga ou desliga toda a parte de GitHub + catálogo.
catalog_enabled: true

# GitHub (github.com ou GitHub Enterprise: https://<host>/api/v3)
github_api_url: "{{ lookup('ansible.builtin.env', 'GITHUB_API_URL') | default('https://api.github.com', true) }}"
github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
# Organização (ou usuário dono do token) onde os repositórios são criados.
github_owner: "{{ lookup('ansible.builtin.env', 'GITHUB_OWNER') }}"
# private | public. Repositório privado exige integração GitHub no RHDH com
# token que consiga lê-lo.
github_repo_visibility: private
github_headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"

# Developer Hub. Deixe rhdh_url vazio para não registrar via API (por
# exemplo, quando o RHDH já descobre os repositórios com o discovery
# provider do GitHub).
rhdh_url: "{{ lookup('ansible.builtin.env', 'RHDH_URL') }}"
rhdh_token: "{{ lookup('ansible.builtin.env', 'RHDH_TOKEN') }}"
rhdh_validate_certs: true

# Entidades geradas
catalog_file_path: catalog-info.yaml
# Dono das entidades: usuário ou grupo que existe no catálogo (com RHBK,
# os que o provider do Keycloak importou). Ex.: group:default/time-a
catalog_owner: group:default/plataforma
catalog_lifecycle: experimental
