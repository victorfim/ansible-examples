---
# Cria um projeto (namespace) no OpenShift e, opcionalmente, implanta nele
# uma aplicação httpd de exemplo, como faria o `oc new-app`.
#
# Variáveis:
#   project_name          (obrigatória) nome do projeto, ex.: "minha-app-dev"
#   project_display_name  (opcional)    nome de exibição no console
#   project_description   (opcional)    descrição do projeto
#   deploy_sample_app     (opcional)    implanta a aplicação de exemplo; padrão true
#   app_name              (opcional)    nome da aplicação; padrão "httpd-example"
#
# Autenticação: no AAP, associe ao Job Template uma credencial do tipo
# "OpenShift or Kubernetes API Bearer Token". Ela injeta K8S_AUTH_HOST,
# K8S_AUTH_API_KEY e K8S_AUTH_VERIFY_SSL, lidas automaticamente pelos
# módulos da coleção kubernetes.core.
#
# O projeto é criado via ProjectRequest (mesmo comportamento do
# `oc new-project`), respeitando o template de projeto do cluster.
#
# A aplicação equivale a:
#   oc new-app registry.access.redhat.com/ubi9/httpd-24~https://github.com/sclorg/httpd-ex
#   oc create route edge --service=<app_name>
# Ela é criada com recursos do Kubernetes (ImageStream, BuildConfig,
# Deployment, Service e Route), sem depender do binário `oc` no EE.
# Tudo é idempotente: rodar de novo não duplica nada.

- name: Criar projeto no OpenShift com aplicação httpd de exemplo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_display_name: ""
    project_description: ""
    deploy_sample_app: true
    app_name: httpd-example
    app_builder_image: registry.access.redhat.com/ubi9/httpd-24:latest
    app_git_repo: https://github.com/sclorg/httpd-ex.git
    app_git_ref: master
    app_labels:
      app: "{{ app_name }}"
      app.kubernetes.io/name: "{{ app_name }}"
      app.kubernetes.io/component: "{{ app_name }}"
      app.kubernetes.io/instance: "{{ app_name }}"
      app.kubernetes.io/part-of: "{{ project_name }}"
      app.openshift.io/runtime: apache

  tasks:
    - name: Validar os parâmetros
      ansible.builtin.assert:
        that:
          - project_name is defined
          - project_name | length > 0
          - project_name | length <= 63
          - project_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - not (project_name is match('^(openshift|kube)-'))
          - project_name not in ['default', 'openshift', 'kube-system', 'kube-public']
        fail_msg: >-
          Nome de projeto inválido: '{{ project_name | default('') }}'.
          Use até 63 caracteres, apenas letras minúsculas, números e hífen,
          começando e terminando com letra ou número. Prefixos 'openshift-'
          e 'kube-' e nomes reservados não são permitidos.
        quiet: true

    - name: Validar o nome da aplicação
      ansible.builtin.assert:
        that:
          - app_name is match('^[a-z]([-a-z0-9]*[a-z0-9])?$')
          # O host padrão da Route é <app_name>-<project_name>.<domínio>,
          # e esse primeiro trecho do host não pode passar de 63 caracteres.
          - (app_name | length) + (project_name | length) + 1 <= 63
        fail_msg: >-
          Nome de aplicação inválido: '{{ app_name }}'. Use letras minúsculas,
          números e hífen, começando com letra. A soma dos tamanhos de
          app_name e project_name precisa ser no máximo 62 caracteres.
        quiet: true
      when: deploy_sample_app | bool

    - name: Verificar se há credencial do OpenShift
      ansible.builtin.assert:
        that: >-
          lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | length > 0 or
          lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG') | length > 0 or
          lookup('ansible.builtin.env', 'KUBECONFIG') | length > 0 or
          '~/.kube/config' | expanduser is file
        fail_msg: >-
          Nenhuma credencial do OpenShift encontrada. No AAP, associe ao Job
          Template uma credencial do tipo "OpenShift or Kubernetes API Bearer
          Token" (aba Details > Credentials). Fora do AAP, exporte
          K8S_AUTH_HOST e K8S_AUTH_API_KEY ou faça `oc login`.
        quiet: true

    # ------------------------------------------------------------------
    # Projeto
    # ------------------------------------------------------------------

    - name: Verificar se o projeto já existe
      kubernetes.core.k8s_info:
        api_version: project.openshift.io/v1
        kind: Project
        name: "{{ project_name }}"
      register: existing_project
      # Usuários sem permissão de admin recebem 403 ao consultar um projeto
      # inexistente; nesse caso seguimos para a criação. Outros erros falham.
      failed_when: >-
        existing_project is failed and
        not (existing_project.msg | default('') is search('Forbidden|403'))

    - name: Criar o projeto
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: project.openshift.io/v1
          kind: ProjectRequest
          metadata:
            name: "{{ project_name }}"
          displayName: "{{ project_display_name }}"
          description: "{{ project_description }}"
      when: existing_project.resources | default([]) | length == 0
      register: created_project

    - name: Aguardar o projeto ficar ativo
      kubernetes.core.k8s_info:
        api_version: project.openshift.io/v1
        kind: Project
        name: "{{ project_name }}"
      register: project_status
      until: >-
        project_status.resources | default([]) | length > 0 and
        project_status.resources[0].status.phase | default('') == 'Active'
      retries: 12
      delay: 5
      when: created_project is changed

    # ------------------------------------------------------------------
    # Aplicação de exemplo (equivalente ao oc new-app)
    # ------------------------------------------------------------------

    - name: Implantar a aplicação httpd de exemplo
      when: deploy_sample_app | bool
      block:
        - name: Criar ImageStream e BuildConfig
          kubernetes.core.k8s:
            state: present
            namespace: "{{ project_name }}"
            definition:
              - apiVersion: image.openshift.io/v1
                kind: ImageStream
                metadata:
                  name: "{{ app_name }}"
                  labels: "{{ app_labels }}"
                spec:
                  lookupPolicy:
                    local: false

              - apiVersion: build.openshift.io/v1
                kind: BuildConfig
                metadata:
                  name: "{{ app_name }}"
                  labels: "{{ app_labels }}"
                spec:
                  source:
                    type: Git
                    git:
                      uri: "{{ app_git_repo }}"
                      ref: "{{ app_git_ref }}"
                  strategy:
                    type: Source
                    sourceStrategy:
                      from:
                        kind: DockerImage
                        name: "{{ app_builder_image }}"
                  output:
                    to:
                      kind: ImageStreamTag
                      name: "{{ app_name }}:latest"
                  # ConfigChange dispara o primeiro build assim que a
                  # BuildConfig é criada, como faz o oc new-app.
                  triggers:
                    - type: ConfigChange

        - name: Aguardar o build terminar
          kubernetes.core.k8s_info:
            api_version: build.openshift.io/v1
            kind: Build
            namespace: "{{ project_name }}"
            label_selectors:
              - "buildconfig={{ app_name }}"
          register: builds
          until: >-
            builds.resources | default([]) | length > 0 and
            (builds.resources | sort(attribute='metadata.creationTimestamp') | last).status.phase
            in ['Complete', 'Failed', 'Error', 'Cancelled']
          retries: 60
          delay: 10

        - name: Confirmar que o build foi concluído com sucesso
          vars:
            last_build: "{{ builds.resources | sort(attribute='metadata.creationTimestamp') | last }}"
          ansible.builtin.assert:
            that: last_build.status.phase == 'Complete'
            fail_msg: >-
              O build {{ last_build.metadata.name }} terminou com status
              {{ last_build.status.phase }}: {{ last_build.status.message | default('sem mensagem') }}.
              Veja os logs com: oc logs build/{{ last_build.metadata.name }} -n {{ project_name }}
            quiet: true

        - name: Obter a imagem gerada pelo build
          kubernetes.core.k8s_info:
            api_version: image.openshift.io/v1
            kind: ImageStream
            namespace: "{{ project_name }}"
            name: "{{ app_name }}"
          register: image_stream

        - name: Criar Deployment, Service e Route
          vars:
            app_image: >-
              {{ (image_stream.resources[0].status.tags
                  | selectattr('tag', 'equalto', 'latest') | first).items[0].dockerImageReference }}
          kubernetes.core.k8s:
            state: present
            namespace: "{{ project_name }}"
            definition:
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: "{{ app_name }}"
                  labels: "{{ app_labels }}"
                  annotations:
                    # Atualiza o Deployment sozinho a cada novo build.
                    image.openshift.io/triggers: >-
                      [{"from":{"kind":"ImageStreamTag","name":"{{ app_name }}:latest"},
                      "fieldPath":"spec.template.spec.containers[?(@.name==\"{{ app_name }}\")].image"}]
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      deployment: "{{ app_name }}"
                  template:
                    metadata:
                      labels: "{{ app_labels | combine({'deployment': app_name}) }}"
                    spec:
                      containers:
                        - name: "{{ app_name }}"
                          image: "{{ app_image }}"
                          ports:
                            - containerPort: 8080
                              protocol: TCP
                          readinessProbe:
                            httpGet:
                              path: /
                              port: 8080
                            initialDelaySeconds: 3
                            periodSeconds: 10
                          livenessProbe:
                            httpGet:
                              path: /
                              port: 8080
                            initialDelaySeconds: 10
                            periodSeconds: 20
                          resources:
                            requests:
                              cpu: 10m
                              memory: 64Mi
                            limits:
                              memory: 256Mi

              - apiVersion: v1
                kind: Service
                metadata:
                  name: "{{ app_name }}"
                  labels: "{{ app_labels }}"
                spec:
                  selector:
                    deployment: "{{ app_name }}"
                  ports:
                    - name: 8080-tcp
                      port: 8080
                      targetPort: 8080
                      protocol: TCP

              - apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: "{{ app_name }}"
                  labels: "{{ app_labels }}"
                spec:
                  to:
                    kind: Service
                    name: "{{ app_name }}"
                  port:
                    targetPort: 8080-tcp
                  tls:
                    termination: edge
                    insecureEdgeTerminationPolicy: Redirect

        - name: Aguardar a aplicação ficar disponível
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            namespace: "{{ project_name }}"
            name: "{{ app_name }}"
            wait: true
            wait_condition:
              type: Available
              status: "True"
            wait_timeout: 300

        - name: Obter o endereço da aplicação
          kubernetes.core.k8s_info:
            api_version: route.openshift.io/v1
            kind: Route
            namespace: "{{ project_name }}"
            name: "{{ app_name }}"
          register: app_route
          until: app_route.resources[0].spec.host | default('') | length > 0
          retries: 6
          delay: 5

        - name: Guardar o endereço da aplicação
          ansible.builtin.set_fact:
            app_url: "https://{{ app_route.resources[0].spec.host }}"

    # ------------------------------------------------------------------
    # Resultado
    # ------------------------------------------------------------------

    - name: Resultado
      ansible.builtin.debug:
        msg:
          - >-
            {{ 'Projeto ' ~ project_name ~ ' criado com sucesso.'
               if created_project is changed
               else 'Projeto ' ~ project_name ~ ' já existia.' }}
          - >-
            {{ 'Aplicação ' ~ app_name ~ ' disponível em ' ~ app_url
               if app_url is defined
               else 'Aplicação de exemplo não implantada (deploy_sample_app=false).' }}

    - name: Publicar o resultado para outros sistemas (RHDH, workflows)
      ansible.builtin.set_stats:
        data:
          project_name: "{{ project_name }}"
          app_url: "{{ app_url | default('') }}"
