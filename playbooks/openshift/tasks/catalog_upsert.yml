---
# Tarefas compartilhadas: grava entidades no catalog-info.yaml do
# repositório e garante que o Developer Hub conhece esse arquivo.
#
# O arquivo tem vários documentos YAML (um por entidade). Cada entidade de
# catalog_entities atualiza a de mesmo kind + metadata.name: chaves que só
# existem no arquivo (ex.: uma anotação adicionada à mão) são mantidas, e
# listas como tags e links são substituídas. As demais entidades ficam como
# estão. Só há commit quando o conteúdo muda.
#
# Entradas:
#   github_repo               saída de tasks/github_repo.yml
#   catalog_entities          lista de entidades a gravar
#   catalog_commit_message    mensagem do commit
#   catalog_refresh_entity    entidade do arquivo a atualizar no RHDH
#                             (ex.: system:default/meu-projeto)
#   + variáveis de vars/catalog.yml
#
# Saídas: catalog_location_url, catalog_changed

- name: Ler o catalog-info.yaml atual
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/http_request.yml"
  vars:
    req_desc: "Ler {{ catalog_file_path }} de {{ github_repo.full_name }}"
    req_url: >-
      {{ github_api_url }}/repos/{{ github_repo.full_name }}/contents/{{
      catalog_file_path }}?ref={{ github_repo.default_branch | urlencode }}
    req_token: "{{ github_token }}"
    req_headers: "{{ github_headers }}"
    req_status: [200, 404]

- name: Interpretar o arquivo atual
  ansible.builtin.set_fact:
    _catalog_current: "{{ http_response }}"
    _catalog_current_text: >-
      {{ (http_response.json.content | b64decode)
         if http_response.status == 200 else '' }}

- name: Mesclar as entidades
  ansible.builtin.set_fact:
    _catalog_docs: >-
      {%- set ns = namespace(keys=[], seen=[], out=[]) -%}
      {%- for e in catalog_entities -%}
        {%- set ns.keys = ns.keys + [(e.kind | lower) ~ ':' ~ e.metadata.name] -%}
      {%- endfor -%}
      {%- for d in (_catalog_current_text | from_yaml_all | list) if d is mapping -%}
        {%- set k = (d.kind | default('') | lower) ~ ':' ~ (d.metadata.name | default('')) -%}
        {%- if k in ns.keys and k not in ns.seen -%}
          {%- set ns.out = ns.out + [d | combine(catalog_entities[ns.keys.index(k)], recursive=True)] -%}
          {%- set ns.seen = ns.seen + [k] -%}
        {%- elif k not in ns.keys -%}
          {%- set ns.out = ns.out + [d] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for e in catalog_entities -%}
        {%- if ((e.kind | lower) ~ ':' ~ e.metadata.name) not in ns.seen -%}
          {%- set ns.out = ns.out + [e] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Gerar o novo conteúdo
  ansible.builtin.set_fact:
    _catalog_new_text: >-
      {{ '# Gerado pelo Ansible Automation Platform (ansible-examples).\n'
         ~ '# Entidades com o mesmo kind e nome são atualizadas a cada execução.\n'
         ~ '---\n'
         ~ (_catalog_docs | map('to_nice_yaml', indent=2, sort_keys=False) | join('---\n')) }}

- name: Gravar o catalog-info.yaml no GitHub
  when: _catalog_new_text != _catalog_current_text
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/http_request.yml"
  vars:
    req_desc: "Gravar {{ catalog_file_path }} em {{ github_repo.full_name }}"
    req_url: "{{ github_api_url }}/repos/{{ github_repo.full_name }}/contents/{{ catalog_file_path }}"
    req_method: PUT
    req_token: "{{ github_token }}"
    req_headers: "{{ github_headers }}"
    req_status: [200, 201]
    req_body: >-
      {{ {'message': catalog_commit_message,
          'content': _catalog_new_text | b64encode,
          'branch': github_repo.default_branch}
         | combine({'sha': _catalog_current.json.sha}
                   if _catalog_current.status == 200 else {}) }}

- name: Registrar o resultado
  ansible.builtin.set_fact:
    catalog_changed: "{{ _catalog_new_text != _catalog_current_text }}"
    catalog_location_url: >-
      {{ github_repo.html_url }}/blob/{{ github_repo.default_branch }}/{{ catalog_file_path }}

- name: Avisar que o registro via API está desligado
  ansible.builtin.debug:
    msg: >-
      rhdh_url não informado: o arquivo {{ catalog_location_url }} foi gravado,
      mas não foi registrado via API. O Developer Hub precisa descobri-lo pelo
      discovery provider do GitHub.
  when: rhdh_url | default('') | length == 0

- name: Registrar no Developer Hub
  when: rhdh_url | default('') | length > 0
  block:
    - name: Verificar o token do Developer Hub
      ansible.builtin.assert:
        that: rhdh_token | default('') | length > 0
        fail_msg: >-
          rhdh_url está definido, mas rhdh_token não. Configure um token de
          acesso externo (backend.auth.externalAccess) no Developer Hub e
          informe-o na credencial "GitHub + Developer Hub Catalog".
        quiet: true

    - name: Registrar a location no catálogo
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/http_request.yml"
      vars:
        req_desc: "Registrar {{ catalog_location_url }} no Developer Hub"
        req_url: "{{ rhdh_url | regex_replace('/+$', '') }}/api/catalog/locations"
        req_method: POST
        req_token: "{{ rhdh_token }}"
        req_validate_certs: "{{ rhdh_validate_certs }}"
        # 409 = a location já estava registrada.
        req_status: [201, 409]
        req_body:
          type: url
          target: "{{ catalog_location_url }}"

    # Se a location já existia e o arquivo mudou, pede ao RHDH para relê-lo
    # agora em vez de esperar o próximo ciclo de processamento.
    - name: Atualizar a entidade no Developer Hub
      when:
        - http_response.status == 409
        - catalog_changed | bool
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/http_request.yml"
      vars:
        req_desc: "Atualizar {{ catalog_refresh_entity }} no Developer Hub"
        req_url: "{{ rhdh_url | regex_replace('/+$', '') }}/api/catalog/refresh"
        req_method: POST
        req_token: "{{ rhdh_token }}"
        req_validate_certs: "{{ rhdh_validate_certs }}"
        req_status: [200, 204]
        req_allow_fail: true
        req_body:
          entityRef: "{{ catalog_refresh_entity }}"
