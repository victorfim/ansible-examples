---
# Tarefas compartilhadas: confere se há credencial do OpenShift disponível.
# Uso: - ansible.builtin.import_tasks: tasks/check_credentials.yml

- name: Verificar se há credencial do OpenShift
  ansible.builtin.assert:
    that: >-
      lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | length > 0 or
      lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG') | length > 0 or
      lookup('ansible.builtin.env', 'KUBECONFIG') | length > 0 or
      '~/.kube/config' | expanduser is file
    fail_msg: >-
      Nenhuma credencial do OpenShift encontrada. No AAP, associe ao Job
      Template uma credencial do tipo "OpenShift or Kubernetes API Bearer
      Token" (aba Details > Credentials). Fora do AAP, exporte
      K8S_AUTH_HOST e K8S_AUTH_API_KEY ou faça `oc login`.
    quiet: true
