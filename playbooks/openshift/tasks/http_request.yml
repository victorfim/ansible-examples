---
# Tarefas compartilhadas: faz uma requisição HTTP autenticada por token
# (GitHub ou Developer Hub) sem expor o token no log do job.
#
# A chamada roda com no_log, e a tarefa seguinte confere o status HTTP e
# mostra uma mensagem de erro legível (sem o token).
#
# Entradas:
#   req_desc            descrição mostrada no log
#   req_url             URL completa
#   req_token           token Bearer
#   req_method          (opcional) padrão GET
#   req_body            (opcional) corpo enviado como JSON
#   req_headers         (opcional) cabeçalhos extras
#   req_status          (opcional) lista de status aceitos; padrão [200]
#   req_allow_fail      (opcional) true = só avisa em caso de erro
#   req_validate_certs  (opcional) padrão true
#
# Saída: http_response (resultado do módulo uri)

- name: "{{ req_desc }}"
  ansible.builtin.uri:
    url: "{{ req_url }}"
    method: "{{ req_method | default('GET') }}"
    headers: >-
      {{ {'Authorization': 'Bearer ' ~ req_token,
          'Accept': 'application/json'} | combine(req_headers | default({})) }}
    body_format: json
    body: "{{ req_body | default(omit) }}"
    status_code: "{{ req_status | default([200]) }}"
    validate_certs: "{{ req_validate_certs | default(true) }}"
    return_content: true
  register: http_response
  failed_when: false
  no_log: true

- name: "{{ req_desc }}: conferir resposta"
  ansible.builtin.assert:
    that: http_response.status | default(-1) | int in (req_status | default([200]))
    fail_msg: >-
      {{ req_desc }} falhou: HTTP {{ http_response.status | default('sem resposta') }}
      em {{ req_method | default('GET') }} {{ req_url }}.
      {{ http_response.json.message
         | default(http_response.json.error.message
         | default(http_response.msg | default(''))) }}
    quiet: true
  ignore_errors: "{{ req_allow_fail | default(false) | bool }}"
